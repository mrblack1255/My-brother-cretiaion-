<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RX DANGER // Void Protocol</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --accent: #00ff66;
            --accent-dim: rgba(0, 255, 102, 0.15);
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .reticle {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .motto {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .signature-box {
            background: var(--accent-dim);
            border: 1px dashed var(--accent);
            padding: 15px;
            text-align: center;
            margin: 25px 0;
            cursor: pointer;
            transition: 0.3s;
        }

        .signature-box:hover {
            background: rgba(0, 255, 102, 0.25);
            box-shadow: 0 0 15px var(--accent-dim);
        }

        .signature-text {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .copy-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: none;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="reticle">⍤</div>
            <h1>RX DANGER</h1>
            <div class="motto">DO_OR_DIE</div>
        </div>

        <div class="signature-box" onclick="copySignature()">
            <div class="signature-text">⍤ [ ラッビ ] // 𝕯.𝕿.𝕏</div>
            <div class="copy-hint">[ Click to Copy Signature ]</div>
        </div>

        <div class="links-list">
            <a href="https://github.com/mrblack1255" target="_blank" class="btn">GitHub Core</a>
            <a href="https://github.com/mrblack1255/RX-RABBI.-.git" target="_blank" class="btn">Signature Vault</a>
            <a href="https://tiktok.com/@nagato.pain.ofc" target="_blank" class="btn">TikTok Protocol</a>
        </div>

        <div class="footer">
            SYSTEM STATUS: ONLINE // 2026
        </div>
    </div>

    <div class="toast" id="toast">COPIED TO CLIPBOARD</div>

    <script>
        function copySignature() {
            const sig = "⍤ [ ラッビ ] // 𝕯.𝕿.𝕏";
            navigator.clipboard.writeText(sig).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
